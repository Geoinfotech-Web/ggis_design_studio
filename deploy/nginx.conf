# GIS Design Studio — production web server.
#
# Serves the built studio (dist/) and routes its two APIs to the services
# beside it, so the browser only ever talks to one origin. That matters for
# two reasons: the account session cookie is first-party and needs no CORS,
# and the paths are the same ones the Vite dev server proxies in development
# (vite.config.js), so the front end runs unchanged.
#
#   /api/account/*  →  account server  (accounts:8789)
#   /api/cache/*    →  geodata cache   (cache:8788)
#   everything else →  the static app, falling back to index.html
#
# TLS is expected to end in front of this container (a load balancer, Caddy,
# Traefik, Cloudflare…). Whatever terminates it must pass X-Forwarded-Proto
# and X-Forwarded-For through.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # A saved project carries its study-area outlines (MAX_PROJECT_BYTES,
  # 25 MB by default); a cache upload can be a whole state's roads.
  client_max_body_size 128m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /api/account/ {
    proxy_pass http://accounts:8789/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/cache/ {
    proxy_pass http://cache:8788/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Large downloads are streamed straight from the database already
    # gzipped; buffering them here would only add memory and delay.
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # Vite fingerprints every built asset, so they can be cached for good.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # The app itself: always revalidated, so a deploy reaches users at once.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
